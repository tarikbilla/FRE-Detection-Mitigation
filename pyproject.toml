[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fre-platform"
version = "1.0.0"
description = "Receive-only FRE (radio ripple control) detection & mitigation research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pymongo>=4.6",
    "dnspython>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "mongomock>=4.1"]

[project.scripts]
fre-platform = "fre_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "atlas: needs a real MongoDB Atlas connection (FRE_MONGODB_URI)",
    "hardware: needs an attached Airspy HF+ receiver",
]
